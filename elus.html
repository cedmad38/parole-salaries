<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e1526" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PS Élus" />
  <title>Parole Salariés By Cedmad — Espace élus</title>
  <link rel="manifest" href="elus.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/elus.css" />
</head>
<body>
  <div id="elus-app"><!-- injecté par elus.js --></div>
  <div id="toast-host"></div>

  <!-- Bouton d'installation de l'application (PWA — icône Dock, fenêtre indépendante) -->
  <button id="install-btn" class="pwa-install-btn" type="button" hidden>
    ⬇︎<span class="lbl"> Installer l'application</span>
    <span id="install-close" class="pwa-install-close" role="button" tabindex="0"
          aria-label="Ne plus proposer l'installation" title="Ne plus proposer">✕</span>
  </button>

  <!-- Librairie Supabase + configuration + pilote en ligne (prêts) -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/export.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/elus.js"></script>

  <script>
    // Service worker (nécessaire pour l'installation en application)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
    // Invite d'installation (Chrome / Edge sur Mac)
    const installBtn = document.getElementById('install-btn');
    const closeBtn = document.getElementById('install-close');
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    // `isStandalone` dit seulement « cette page tourne-t-elle DANS l'app installée ».
    // Rouvert dans un onglet normal, il repasse à false et l'invite réapparaissait alors
    // que l'app était déjà installée (et sur Safari, aucune API ne permet de le savoir).
    // On mémorise donc le choix : installée ou écartée = on ne propose plus.
    const HIDE_KEY = 'ps_install_dismissed';
    const isDismissed = () => { try { return localStorage.getItem(HIDE_KEY) === '1'; } catch (e) { return false; } };
    const dismiss = () => { try { localStorage.setItem(HIDE_KEY, '1'); } catch (e) {} installBtn.hidden = true; };
    const canOffer = () => !isStandalone && !isDismissed();
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); dismiss(); });
    closeBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); dismiss(); } });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; if (canOffer()) installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; dismiss();
    });
    window.addEventListener('appinstalled', dismiss);
    // Safari (macOS/iOS) : pas d'invite auto → indice discret pour « Ajouter au Dock »
    const isSafari = /^((?!chrome|android|crios|edg).)*safari/i.test(navigator.userAgent);
    if (isSafari && canOffer()) {
      installBtn.hidden = false;
      installBtn.querySelector('.lbl').textContent = ' Ajouter au Dock (menu Fichier)';
      installBtn.addEventListener('click', () => {
        alert("Dans Safari : menu « Fichier » → « Ajouter au Dock… » pour installer l'espace élus comme application, avec sa propre fenêtre.\n\nDéjà fait ? Cliquez sur la croix ✕ pour ne plus voir cette invite.");
      });
    }
  </script>
</body>
</html>
